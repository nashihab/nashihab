name: Update Projects

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update recent projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: nashihab
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          username = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          # Get public repositories sorted by latest push
          url = (
              f"https://api.github.com/users/{username}/repos"
              "?type=public&sort=pushed&direction=desc&per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
              },
          )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          # Ignore forks
          repos = [
              repo for repo in repos
              if not repo["fork"]
          ]

          # Pick the 4 most recently pushed repositories
          repos = repos[:4]

          # Build Gitskins repo list
          repo_list = ",".join(
              f"{username}/{repo['name']}"
              for repo in repos
          )

          encoded_repos = urllib.parse.quote(repo_list, safe="")

          avatar = (
              "https://avatars.githubusercontent.com/u/"
              "82781075"
              "?u=50dfb7d0c992b4cbc2f4e7e4c853957d2e7cd699&v=4"
          )

          encoded_avatar = urllib.parse.quote(avatar, safe="")

          projects_url = (
              "https://www.gitskins.com/api/section/projects"
              f"?username={username}"
              "&theme=aurora"
              f"&avatar={encoded_avatar}"
              f"&repos={encoded_repos}"
              "&variant=wow"
              "&v=wow-projects-1"
          )

          timeline_url = (
              "https://www.gitskins.com/api/section/projects"
              f"?username={username}"
              "&theme=aurora"
              f"&avatar={encoded_avatar}"
              f"&repos={encoded_repos}"
              "&variant=wow-timeline"
              "&v=wow-timeline-1"
          )

          projects_url_light = projects_url + "&mode=light"
          projects_url_dark = projects_url + "&mode=dark"

          timeline_url_light = timeline_url + "&mode=light"
          timeline_url_dark = timeline_url + "&mode=dark"

          section = f"""<!-- PROJECTS_START -->

          <picture>
            <source
              media="(prefers-color-scheme: light)"
              srcset="{projects_url_light}">
            <img
              width="100%"
              alt="Nahid Ahmed Shihab animated project constellation"
              src="{projects_url_dark}">
          </picture>

          <picture>
            <source
              media="(prefers-color-scheme: light)"
              srcset="{timeline_url_light}">
            <img
              width="100%"
              alt="Nahid Ahmed Shihab animated project launch timeline"
              src="{timeline_url_dark}">
          </picture>

          <!-- PROJECTS_END -->"""

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- PROJECTS_START -->.*?<!-- PROJECTS_END -->"

          if not re.search(pattern, readme, flags=re.DOTALL):
              raise SystemExit(
                  "PROJECTS_START / PROJECTS_END markers not found."
              )

          readme = re.sub(
              pattern,
              section,
              readme,
              flags=re.DOTALL
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)

          print("Updated projects:")
          for repo in repos:
              print(f"- {repo['name']}")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update recent projects"
            git push
          fi
